name: Build Raspberry Pi Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-pi-image.yml
      - pi-image/**
      - infrastructure/compose.yaml

permissions:
  contents: read

env:
  IMAGE_NAME: irrigation-control-lite
  ARTIFACT_NAME: irrigation-control-lite-arm64
  PI_GEN_REPOSITORY: RPi-Distro/pi-gen
  PI_GEN_TAG: 2026-06-18-raspios-trixie-arm64
  RASPBERRY_PI_OS_RELEASE: trixie
  PI_GEN_STAGES: stage0 stage1 stage2 ./pi-image/stage-irrigation-runtime

jobs:
  build:
    name: Build Raspberry Pi OS Lite (ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Pi image flow
        run: bash pi-image/validate.sh

      - name: Validate required secrets
        env:
          SSH_PUBLIC_KEY: ${{ secrets.PI_IMAGE_SSH_PUBLIC_KEY }}
          USER_PASSWORD: ${{ secrets.PI_IMAGE_USER_PASSWORD }}
        run: |
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "PI_IMAGE_SSH_PUBLIC_KEY is not set."
            exit 1
          fi

          if [ -z "$USER_PASSWORD" ]; then
            echo "PI_IMAGE_USER_PASSWORD is not set."
            exit 1
          fi

          case "$USER_PASSWORD" in
            *$'\n'*)
              echo "PI_IMAGE_USER_PASSWORD must not contain a newline."
              exit 1
              ;;
          esac

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$key_file"

          if ! ssh-keygen -l -f "$key_file" > /dev/null; then
            echo "PI_IMAGE_SSH_PUBLIC_KEY must contain a valid OpenSSH public key."
            exit 1
          fi

      - name: Build image
        id: build
        env:
          PORTAINER_ADMIN_USERNAME: irrigation
          PORTAINER_ADMIN_PASSWORD: ${{ secrets.PI_IMAGE_USER_PASSWORD }}
        uses: usimd/pi-gen-action@cec66cba86bdcd23984e6a79ea4e9251d90bc798 # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          pi-gen-repository: ${{ env.PI_GEN_REPOSITORY }}
          pi-gen-version: ${{ env.PI_GEN_TAG }}
          release: ${{ env.RASPBERRY_PI_OS_RELEASE }}
          stage-list: ${{ env.PI_GEN_STAGES }}
          verbose-output: true
          export-last-stage-only: true
          compression: zip
          hostname: irrigation-control
          username: irrigation
          password: ${{ secrets.PI_IMAGE_USER_PASSWORD }}
          enable-ssh: 1
          pubkey-only-ssh: 1
          disable-first-boot-user-rename: 1
          pubkey-ssh-first-user: ${{ secrets.PI_IMAGE_SSH_PUBLIC_KEY }}
          timezone: Europe/Berlin
          locale: de_DE.UTF-8
          keyboard-keymap: de
          keyboard-layout: German

      - name: Generate image checksum
        id: checksum
        env:
          IMAGE_PATH: ${{ steps.build.outputs.image-path }}
        run: |
          image_directory="$(dirname "$IMAGE_PATH")"
          image_filename="$(basename "$IMAGE_PATH")"
          checksum_path="${IMAGE_PATH}.sha256"
          (
            cd "$image_directory"
            sha256sum "$image_filename" > "$(basename "$checksum_path")"
          )
          echo "checksum-path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ steps.build.outputs.image-path }}
            ${{ steps.checksum.outputs.checksum-path }}
          if-no-files-found: error
          retention-days: 14
